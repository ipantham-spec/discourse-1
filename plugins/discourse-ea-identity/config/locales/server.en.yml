en:
  login:
    authenticator_error_fetch_user_details: "Could not retrieve your user details. Do you have an active account?"
    ea_identity_minor_user_restricted: "Your account cannot access this forum due to age and country policy restrictions."
    ea_identity_ip_geo_not_configured: "Your account cannot access this forum because required geo claims are missing from the identity token."
    ea_identity_policy_denied: "Your account cannot access this forum due to identity policy restrictions."

  site_settings:
    ea_identity_enabled: "Enable authentication via the EA Identity service."
    ea_identity_button_title: "The text shown on the EA login button."
    ea_identity_client_id: "The OAuth2 client ID issued by EA."
    ea_identity_auth_client_certificate: "The client certificate (PEM) used to authenticate the token endpoint over mutual TLS. May include intermediate certificates after the leaf certificate."
    ea_identity_auth_client_key: "The private key (PEM) for the token endpoint authentication certificate."
    ea_identity_auth_client_key_passphrase: "The passphrase protecting the token endpoint authentication key, if it is encrypted."
    ea_identity_authorize_url: "The EA authorization URL the user is redirected to when logging in."
    ea_identity_token_url: "The EA token URL used to exchange the authorization code for an access token."
    ea_identity_token_url_method: "The HTTP method used when requesting the token URL."
    ea_identity_scope: "The scope requested during authorization."
    ea_identity_authorize_options: "Additional options to request during authorization."
    ea_identity_authorize_params: "Extra query parameters appended to the authorization request, as a pipe-delimited list of key=value pairs (for example \"release_type=1234|display=junoWeb/login|hide_create=true\")."
    ea_identity_use_pkce: "Use PKCE (S256) for the authorization code flow: send a code_challenge during authorization and the matching code_verifier during the token exchange."
    ea_identity_client_certificate: "The client certificate (PEM) presented to the EA identity endpoint for mutual TLS. May include intermediate certificates after the leaf certificate. mTLS activates automatically when this is set."
    ea_identity_client_key: "The private key for the identity endpoint client certificate (PEM)."
    ea_identity_client_key_passphrase: "The passphrase protecting the identity endpoint private key, if it is encrypted."
    ea_identity_service_token_url: "OAuth2 token endpoint used to mint the service (client_credentials) token sent as the 'Authorization: Bearer' header on the identity call. This is a separate identity provider from the user SSO. Leave blank to reuse the user's SSO access token instead."
    ea_identity_service_client_id: "Client id of the service account used to obtain the service token via the client_credentials grant."
    ea_identity_service_client_secret: "Client secret of the service account used to obtain the service token."
    ea_identity_service_scope: "Optional scope requested when minting the service token."
    ea_identity_ca_certificate: "An optional CA certificate bundle (PEM) used to verify the EA server certificate, in addition to the system trust store."
    ea_identity_verify_ssl: "Verify the EA server's TLS certificate. Only disable this for local testing."
    ea_identity_fetch_user_details: "Call the EA identity endpoint after authentication to fetch the user's profile."
    ea_identity_user_json_url: "The EA identity endpoint URL (we replace :token with the access token and :id with the id returned by the token exchange)."
    ea_identity_user_json_url_method: "The HTTP method used when requesting the identity endpoint."
    ea_identity_user_json_auth_header: "The HTTP header used to send the access token to the identity endpoint. EA expects X-ACCESS-TOKEN."
    ea_identity_user_json_auth_header_scheme: "An optional scheme prefix for the token header value (for example 'Bearer'). Leave blank to send the raw token."
    ea_identity_send_bearer_authorization: "Also send the access token as a standard 'Authorization: Bearer' header, in addition to the custom token header. EA's identity endpoint requires both."
    ea_identity_fail_open_on_policy_errors: "Allow login to continue when the identity endpoint returns a policy-denied response. Keep disabled unless explicitly required."
    ea_identity_json_user_id_path: "Path in the identity JSON to the user id. eg: response.eaId"
    ea_identity_json_username_path: "Path in the identity JSON to the username. eg: response.eaId"
    ea_identity_json_name_path: "Path in the identity JSON to the user's full name."
    ea_identity_json_email_path: "Path in the identity JSON to the user's email. eg: response.email"
    ea_identity_json_email_verified_path: "Path in the identity JSON to the user's email verification state. ea_identity_email_verified must be disabled for this to have any effect."
    ea_identity_json_avatar_path: "Path in the identity JSON to the user's avatar. eg: response.avatar"
    ea_identity_email_verified: "Trust the email address returned by EA as verified."
    ea_identity_overrides_email: "Override the Discourse email with the EA email on every login."
    ea_identity_json_groups_path: "Path in the identity JSON to an array of role objects. eg: response.activeRoles. Leave blank to disable group syncing."
    ea_identity_groups_property: "Which property of each role object to use as the group name."
    ea_identity_use_id_token: "When the token exchange returns an id_token, read the user's details from its claims and skip the identity endpoint call. Note: the id_token signature is not verified."
    ea_identity_id_token_user_id_claim: "The id_token claim holding the user id (falls back to 'sub')."
    ea_identity_id_token_email_claim: "The id_token claim holding the user's email."
    ea_identity_id_token_name_claim: "The id_token claim holding the user's full name."
    ea_identity_id_token_username_claim: "The id_token claim holding the user's username."
    ea_identity_allow_association_change: "Allow users to disconnect and reconnect their Discourse account from EA Identity."
    ea_identity_callback_user_id_path: "Optional path in the token response to the user id, used before the identity endpoint is called."
    ea_identity_debug_auth: "Include rich debugging information in the logs. Access tokens are redacted."
