en:
  site_settings:
    custom_webhooks_enabled: "Send signed moderation events to an external content-moderation pipeline (e.g. CSAM/ToSHUB) when the selected forum events happen."
    custom_webhooks_payload_url: "The HTTPS endpoint that receives the moderation event. Leave blank to disable delivery."
    custom_webhooks_events: "The events that trigger a moderation event delivery."
    custom_webhooks_sso_provider: "Name of the SSO authenticator whose linked account holds the author's external identity. The provider_uid of that account is sent as the actor's sso_id. Leave blank to omit sso_id."
    custom_webhooks_include_images: "Include links to the post's image uploads in the event so the pipeline can scan them (image/CSAM checks)."
    custom_webhooks_http_method: "HTTP method used for the request."
    custom_webhooks_content_type: "Content-Type header sent with the request body."
    custom_webhooks_request_timeout_seconds: "How long to wait for the endpoint to respond before giving up. Delivery fails open — a timeout never blocks the post."
    custom_webhooks_text_check_url: "Endpoint for the synchronous pre-publish text check (composer nudge). Leave blank to disable the nudge. The request is signed the same way as events."
    custom_webhooks_check_text: "Run the pre-publish text nudge: warn the author before a flagged post goes live. Fails open — never hard-blocks composing."
    custom_webhooks_hold_images_pending: "Hold posts that contain images as pending (hidden from everyone but the author) until a clean verdict arrives. Only applies when {{setting:custom_webhooks_include_images}} is enabled."
    custom_webhooks_callback_secret: "Shared secret used to verify the inbound verdict callback (HMAC-SHA256 over the raw body, in the X-Forums-Signature header). Requests that fail verification are rejected with 401."
    custom_webhooks_nudge_metrics_url: "Endpoint that records the author's response to the pre-publish text nudge (Edit or Post anyway), matching the nudging-metrics analytics Khoros records. Leave blank to skip recording — never blocks composing."
    custom_webhooks_secret: "Shared secret used to sign the request body with HMAC-SHA256. When set, the signature is sent in the header named by {{setting:custom_webhooks_signature_header}}. Leave blank to send unsigned requests."
    custom_webhooks_signature_header: "Name of the header carrying the request signature (format: sha256=<hex>)."
    custom_webhooks_extra_headers: "Optional static headers to add to every request, one per line as <strong>Header-Name: value</strong>."
    custom_webhooks_client_certificate: "PEM client certificate used for mutual TLS. Leave blank unless the endpoint requires client-certificate authentication."
    custom_webhooks_client_key: "PEM private key matching the mutual TLS client certificate."
    custom_webhooks_client_key_passphrase: "Passphrase for the mutual TLS private key, if it is encrypted."
    custom_webhooks_ca_certificate: "Optional additional PEM CA certificate(s) to trust when validating the endpoint's TLS certificate."
    custom_webhooks_verify_ssl: "Verify the endpoint's TLS certificate. Only disable for local testing against self-signed certificates."
